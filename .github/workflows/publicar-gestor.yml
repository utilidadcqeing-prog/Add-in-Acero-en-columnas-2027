name: Publicar gestor

on:
  push:
    tags: ['gestor-v*']

# contents: write solo para la release puente en este repo (último paso).
permissions:
  contents: write

env:
  # El mismo que Repositorio.Nombre en el gestor; una prueba vigila que coincidan.
  REPO_RELEASES: utilidadcqeing-prog/CQEING-releases

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout deja la etiqueta como ligera; se trae de nuevo para leer su mensaje (las notas).
      - run: git fetch --force --tags origin
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Versión y notas (mensaje de la etiqueta anotada)
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring('gestor-v'.Length)
          # El gestor solo busca releases estables gestor-vX.Y.Z (ConstructorCatalogo.UltimoGestor).
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "La etiqueta $tag debe ser gestor-vX.Y.Z (sin -rc)." }
          if ((git cat-file -t "refs/tags/$tag") -ne 'tag') { throw "La etiqueta $tag no es anotada. Créela con: git tag -a $tag -m 'notas'" }
          git tag -l --format='%(contents)' $tag | Set-Content notas.md -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Pruebas del gestor
        run: |
          dotnet test gestor/CQEING.Gestor.Core.Tests -c Release
          dotnet test gestor/CQEING.Gestor.Tests -c Release
      - name: Compilar (autocontenido, win-x64) y empaquetar con Velopack
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          dotnet publish gestor/CQEING.Gestor/CQEING.Gestor.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=$version
          if ($LASTEXITCODE) { exit 1 }
          # El botón del gestor dentro de Revit (panel «Gestor») viaja en el paquete del gestor: una carpeta por año de Revit.
          # El gestor lo copia a cada Revit instalado al abrirse (RegistroComplementoRevit).
          foreach ($anio in '2026', '2027') {
            dotnet build addins/gestor-revit/GestorRevit.csproj -c Release -p:RevitVersion=$anio -p:Version=$version -o "publish/revit/$anio"
            if ($LASTEXITCODE) { exit 1 }
            Remove-Item "publish/revit/$anio/*.pdb", "publish/revit/$anio/framework.txt"
            if (-not (Test-Path "publish/revit/$anio/CQEING.GestorRevit.dll")) { throw "El componente de Revit $anio no se compiló." }
            # El aviso de versiones nuevas usa el núcleo del gestor: su DLL tiene que viajar junto al componente.
            if (-not (Test-Path "publish/revit/$anio/CQEING.Gestor.Core.dll")) { throw "Al componente de Revit $anio le falta CQEING.Gestor.Core.dll." }
          }
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE) { exit 1 }
          vpk pack --packId CQEING.Gestor --packVersion $version --packDir publish --mainExe CQEING.Gestor.exe --packTitle "Gestor de add-ins CQEING" --outputDir Releases
          if ($LASTEXITCODE) { exit 1 }
          foreach ($archivo in 'CQEING.Gestor-win-Setup.exe', 'releases.win.json') {
            if (-not (Test-Path (Join-Path Releases $archivo))) { throw "vpk no generó $archivo." }
          }
      - name: Crear la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TOKEN_RELEASES }}
        run: |
          if (-not $env:GH_TOKEN) { throw "Falta el secret TOKEN_RELEASES (docs/planes/2026-10-28-licencias-hoja-google.md, Tarea 8)." }
          $tag = '${{ github.ref_name }}'
          gh release create $tag (Get-ChildItem Releases -File).FullName --repo $env:REPO_RELEASES --title $tag --notes-file notas.md
      # Puente (issue #197): los gestores ya instalados leen este repo y se actualizan desde aquí al gestor que lee
      # REPO_RELEASES. Quitar este paso cuando este repo pase a privado.
      - name: Release puente en este repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag (Get-ChildItem Releases -File).FullName --title $tag --notes-file notas.md
